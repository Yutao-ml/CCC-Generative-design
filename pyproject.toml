[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-ceramic-dmegan-examples"
version = "1.3.0"
description = "DME-GAN inference, morphology and response-screening examples"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.0,<3", "Pillow>=10,<14", "torch==2.9.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
